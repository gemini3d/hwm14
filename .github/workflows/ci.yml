name: ci

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1

on:
  push:
    paths:
      - "**.f"
      - "**.f90"
      - "**/CMakeLists.txt"
      - "**.cmake"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [default, shared]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:

    - &checkout
      uses: actions/checkout@v7

    - name: set FC for macOS
      if: runner.os == 'macOS'
      run: echo "FC=gfortran-15" >> $GITHUB_ENV

    - name: Build and Test
      run: cmake --workflow ${{ matrix.preset }}

    - name: Install
      run: cmake --install build

  windows:
    timeout-minutes: 15
    runs-on: windows-latest

    steps:
    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: gcc
        version: 15

    - *checkout

    - name: Configure
      run: cmake --workflow default
